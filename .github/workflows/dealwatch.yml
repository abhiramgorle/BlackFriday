name: dealwatch

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dealwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check deals and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run.py once

      - name: Save alert state back to the repo
        run: |
          git config user.name "dealwatch-bot"
          git config user.email "dealwatch-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update alert state [skip ci]"
            git pull --rebase
            git push
          fi
